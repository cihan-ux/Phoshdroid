name: Android 10 source compatibility

on:
  push:
    branches: [android10-compat]
  workflow_dispatch:

jobs:
  compile-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Use the preinstalled Android SDK (ANDROID_HOME), without the retired 'tools' package.
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile sources and run unit tests, do not publish incomplete APK
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest
