name: Android 10 source compatibility

on:
  push:
    branches: [android10-compat]
  workflow_dispatch:

jobs:
  compile-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already provides Android SDK command-line tools.
      # setup-android@v3 requests the retired 'tools' SDK package and fails.
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          sdkmanager --version
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile sources and run unit tests, do not publish incomplete APK
        run: ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest
